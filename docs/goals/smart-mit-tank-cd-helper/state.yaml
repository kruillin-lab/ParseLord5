goal:
  title: "Smart mitigation + tank cooldown helper integration"
  slug: smart-mit-tank-cd-helper
  kind: specific
  tranche: "All PvE tanks ported (WAR/PLD/GNB/DRK); operator in-game validation per notes/T007-multi-tank-port.md; T999 audit pending"
  status: active
  oracle:
    signal: "Smart mit uses tank CD helper data to pick subset of CDs per event; build + rotation-evals pass; scenario matrix documented"
