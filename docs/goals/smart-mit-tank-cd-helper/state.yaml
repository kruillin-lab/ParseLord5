    final_proof: "Receipt-backed code paths + verify commands + scenario matrix in notes/"
  intake:
    original_request: "Integrate tank cooldown helper into smart mitigation so PL5 predicts which CDs to use instead of using all cooldowns"
    interpreted_outcome: "Selective, helper-informed tank CD usage in smart mitigation"
    input_shape: specific
    audience: ParseLord5 tank users
    authority: requested
    proof_type: test
    completion_proof: "Selective CD selection with helper integration; build/evals green; documented scenarios"
    likely_misfire: "Helper wired but decision logic still casts every CD"
    blind_spots_considered:
      - "In-game proof may be operator-run on Windows"
      - "Per-job CD kits differ"
    existing_plan_facts: []

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  continuous_until_full_outcome: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true

agents:
  scout: cursor_task_explore_readonly
  judge: cursor_main_thread
  worker: cursor_main_thread
  pm: cursor_main_thread

visual_board:
